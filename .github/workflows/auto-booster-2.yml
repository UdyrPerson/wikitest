name: Auto-ouverture booster WikiMasters (compte test 2)

# Meme logique que auto-booster.yml (voir ce fichier pour les details
# complets), pour un second compte de test independant. Fichier separe
# plutot qu'un seul workflow partage : secrets GitHub Actions pas concus
# pour un choix dynamique propre par job, panne/erreur d'un compte
# n'affecte pas l'autre, et debogage plus simple.
#
# Change le 30/08/2026 comme auto-booster.yml : ouvre tous les boosters
# disponibles d'un coup (--count 10, s'arrete tout seul a packs_remaining=0)
# avec 5-10s entre chaque ouverture, cron ~90 min au lieu de 10 min.
#
# Decale de 45 min par rapport au premier compte (moitie de 90 min) pour
# que les deux ne se declenchent jamais au meme instant : 0:45, 2:15,
# 3:45, 5:15... en alternant minute 45 (memes heures que le cron 1) et
# minute 15 (heures intermediaires).

on:
  schedule:
    - cron: "45 0,3,6,9,12,15,18,21 * * *"
    - cron: "15 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch: {}
  workflow_call: {}  # appelable depuis open-all-boosters.yml (secrets: inherit)

permissions:
  contents: read

concurrency:
  group: wm-auto-booster-2
  cancel-in-progress: false

jobs:
  open-booster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit la session du compte de test 2 depuis le secret
        env:
          WM_TEST2_STORAGE_STATE: ${{ secrets.WM_TEST2_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('storage_state.json').write_text(os.environ['WM_TEST2_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s) avant l'appel
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      - name: Ouvre tous les boosters disponibles (mode API, sans navigateur)
        run: python wm_open_booster.py --api --count 10
