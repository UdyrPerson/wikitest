name: Rachat des encheres du vendeur suivi

# Le compte collecteur rachete, au prix demande, toutes les encheres
# actives d'un vendeur donne.
#
# LE VENDEUR N'EST PAS DANS CE FICHIER
#
# Le depot est public, et ses journaux d'execution le sont donc aussi.
# L'identite du vendeur vit dans le secret WM_MARKET_SELLER (son UUID de
# preference, opaque ; son pseudo marche aussi), exactement comme le
# pseudo du collecteur vit dans WM_TRADE_RECIPIENT. wm_market_buy.py ne
# l'imprime jamais, meme en cas d'erreur.
#
# Reserve honnete : les journaux affichent les titres de cartes et les
# prix des mises posees. Qui observerait le marche en direct pourrait, en
# recoupant, remonter au vendeur. Supprimer aussi les titres rendrait le
# journal inexploitable en cas de panne ; le compromis est assume.
#
# « AU PRIX FIXE » A UN SENS PRECIS
#
# La mise minimale du jeu vaut base_amount tant que personne n'a mise, et
# max(ceil(1.1 * current_bid), current_bid + 1) ensuite. Le prix demande
# n'est donc atteignable que sur une enchere vierge : des qu'un tiers se
# positionne, le script saute l'enchere au lieu de surencherir. C'est la
# consigne, et c'est ce qui borne la depense.
#
# DECLENCHEMENT MANUEL UNIQUEMENT, ET C'EST UN CHOIX MESURE
#
# Ce workflow a d'abord tourne en cron */10. Mesure sur 8 h le 06/09/2026,
# en comptant les evenements schedule reellement recus :
#
#     ouverture (6 lignes cron)   11 runs sur 10 attendus   115 %
#     defausse  (6 lignes cron)   10 runs sur 10 attendus   104 %
#     vente     (6 lignes cron)    4 runs sur 10 attendus    42 %
#     rachat    (*/10)             1 run  sur 48 attendus     2 %
#
# GitHub deprioritise massivement les crons courts : le rachat partait une
# fois toutes les huit heures, pas toutes les dix minutes. Aucune cadence
# de 10 min n'est atteignable ici, quoi qu'on ecrive dans le fichier -- et
# une enchere de 10 minutes ne sera donc jamais rattrapee par un cron.
#
# Plutot que d'entretenir l'illusion d'un rachat automatique qui ne part
# presque jamais, le workflow est explicitement manuel : on le lance quand
# on sait qu'il y a quelque chose a racheter. Un declenchement manuel
# part immediatement, lui.
#
# dry_run est donc FAUX par defaut : chaque lancement est deliberé, et
# une simulation qui n'achete rien serait la mauvaise surprise (constatee
# le 06/09/2026, ou un lancement a l'air d'avoir echoue alors qu'il avait
# seulement simule). Coche la case pour simuler.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation seule (ne mise pas, montre ce qui serait achete)"
        type: boolean
        default: false
      complet:
        description: "Balayer tout le marche, sans filtre de date de fin (lent)"
        type: boolean
        default: false
      fenetre_min:
        description: "Ne racheter que les encheres finissant dans moins de N minutes"
        default: "10"
      max_depense:
        description: "Plafond de depense pour ce passage, en wb (vide = tout le solde)"
        default: ""
      vendeur:
        description: "Racheter un AUTRE vendeur (pseudo ou UUID). Vide = le vendeur suivi. Attention : ce qu'on tape ici apparait en clair dans le journal du run, contrairement au secret."
        default: ""

permissions:
  contents: read

# CONCURRENCE PARTAGEE, NON NEGOCIABLE.
# Ce workflow charge le secret du collecteur et le repousse apres coup,
# comme les quatre autres. Deux workflows qui tournent en meme temps
# repoussent des jetons issus de copies chargees a des instants
# differents, ce qui rejoue un refresh token deja consomme et revoque la
# session (cf CLAUDE.md). Le sortir de ce groupe pour gagner en reactivite
# serait exactement l'erreur du 04/09/2026.
concurrency:
  group: wm-sessions
  cancel-in-progress: false

jobs:
  buy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit la session du collecteur depuis son secret
        env:
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
        run: python -c "import os, pathlib; pathlib.Path('state3.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"

      # Le workflow etant purement manuel, inputs.dry_run est toujours
      # renseigne : pas besoin du garde-fou sur github.event_name qu'ont
      # sell.yml et consorts, ou la chaine vide d'un run planifie ferait
      # basculer un test naif sur le mauvais cas.
      - name: Choisit simulation ou mise reelle
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "GO=" >> "$GITHUB_ENV"
            echo "Mode simulation : aucune mise ne sera posee."
          else
            echo "GO=--go" >> "$GITHUB_ENV"
            echo "Mode reel : les encheres du vendeur suivi seront rachetees."
          fi
          if [ "${{ inputs.complet }}" = "true" ]; then
            echo "COMPLET=--complet" >> "$GITHUB_ENV"
          else
            echo "COMPLET=" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ inputs.max_depense }}" ]; then
            echo "PLAFOND=--max-depense ${{ inputs.max_depense }}" >> "$GITHUB_ENV"
          else
            echo "PLAFOND=" >> "$GITHUB_ENV"
          fi

      # Un cron au metronome est la signature la plus facile a reperer.
      - name: Jitter aleatoire (0-20s)
        run: python -c "import random, time; time.sleep(random.uniform(0, 20))"

      - name: Collecteur -> rachete les encheres du vendeur suivi
        id: buy
        continue-on-error: true
        env:
          # L'entree manuelle l'emporte, le secret reste le defaut : on peut
          # viser un autre vendeur pour un passage sans rien changer au
          # reglage permanent. wm_market_buy.py accepte un pseudo comme un
          # UUID, et ne l'imprime dans aucun des deux cas.
          WM_MARKET_SELLER: ${{ inputs.vendeur || secrets.WM_MARKET_SELLER }}
        run: |
          python wm_market_buy.py state3.json \
            --fenetre-min "${{ inputs.fenetre_min || '10' }}" \
            $COMPLET $PLAFOND $GO | tee -a "$GITHUB_STEP_SUMMARY"

      # La session repart dans son secret juste apres le passage, jamais
      # plus tard : c'est ce qui ramene la fenetre de course de plusieurs
      # minutes a quelques secondes.
      - name: Collecteur -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST3_STORAGE_STATE --repo ${{ github.repository }} < state3.json

      # On rougit franchement, contrairement a report-rares qui est manuel
      # lui aussi : la difference est qu'ici l'echec veut dire « le rachat
      # n'a pas eu lieu », ce qui appelle une action immediate. Un rapport
      # de lecture rate se relance, une enchere manquee expire.
      - name: Signale l'echec du collecteur
        if: steps.buy.outcome != 'success'
        run: |
          {
            echo "## Le collecteur a echoue"
            echo ""
            echo "Causes possibles, dans l'ordre de frequence :"
            echo ""
            echo "- session revoquee (401 dans le journal de l'etape) :"
            echo '  ```'
            echo "  python wm_session_repair.py collecteur"
            echo '  ```'
            echo "- TimeoutError : le site n'a pas repondu a temps, relancer suffit."
            echo ""
            echo "Lire le journal de l'etape avant de reparer : une reconnexion"
            echo "inutile invalide une session qui allait tres bien."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
