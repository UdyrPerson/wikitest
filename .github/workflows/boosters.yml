name: Ouverture boosters (9 comptes, sequentiel)

# Remplace les cinq workflows auto-booster*.yml et l'orchestrateur
# open-all-boosters.yml, fusionnes le 03/09/2026.
#
# Pourquoi la fusion :
#   1. Cout. GitHub facture A LA MINUTE ENTAMEE ET PAR JOB. Cinq jobs de
#      30 s coutaient 5 minutes ; un seul job qui enchaine les cinq comptes
#      en coute 2 a 3. C'est ce qui a fait exploser le quota (2 000 min/mois
#      en depot prive) et bloque tous les workflows le 03/09.
#   2. Simplicite. Un seul fichier, un seul cron, un seul endroit a lire.
#
# Ce qu'on abandonne : le decalage anti-correlation entre comptes. Les cinq
# comptes ouvrent desormais leurs paquets a quelques minutes d'intervalle
# dans le meme run, au lieu d'etre repartis sur le cycle. Choix explicite de
# l'utilisateur le 03/09/2026. Les garde-fous qui restent : 5-10 s entre
# deux ouvertures (API_DELAY), jitter aleatoire en tete de run, et l'ordre
# sequentiel -- jamais deux comptes en parallele.
#
# Chaque compte repousse SA session dans SON secret juste apres son
# passage, jamais tous a la fin : sinon ce workflow ecraserait un secret
# rafraichi entre-temps par un autre, avec un refresh token deja consomme a
# la cle -- ce qui revoque la session (cf wm_session_io.py).
#
# Cadence 50 min, six lignes cron car 50 ne divise pas 60 : le motif ne se
# referme qu'au bout de 5 h (PPCM de 50 et 60). "*/50" est invalide sur le
# champ des minutes.

on:
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
    - cron: "10 4,9,14,19 * * *"
    - cron: "20 3,8,13,18,23 * * *"
    - cron: "30 2,7,12,17,22 * * *"
    - cron: "40 1,6,11,16,21 * * *"
    - cron: "50 0,5,10,15,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# CONCURRENCE PARTAGEE ENTRE TOUS LES WORKFLOWS DE SESSION.
# Les cinq workflows chargent les memes cinq secrets au demarrage et les
# repoussent apres chaque compte. Avec un groupe par workflow, rien ne les
# empechait de tourner en meme temps : chacun repoussait alors des jetons
# issus d'une copie chargee avant l'autre, ce qui rejoue un refresh token
# deja consomme et fait revoquer la session.
# Constate le 04/09/2026 : un run de boosters de 93 min pendant lequel la
# defausse, le trade et la vente sont tous passes.
concurrency:
  group: wm-sessions
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit les sessions des neuf comptes depuis les secrets
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
          WM_TEST2_STORAGE_STATE: ${{ secrets.WM_TEST2_STORAGE_STATE }}
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
          WM_TEST4_STORAGE_STATE: ${{ secrets.WM_TEST4_STORAGE_STATE }}
          WM_TEST5_STORAGE_STATE: ${{ secrets.WM_TEST5_STORAGE_STATE }}
          WM_TEST6_STORAGE_STATE: ${{ secrets.WM_TEST6_STORAGE_STATE }}
          WM_TEST7_STORAGE_STATE: ${{ secrets.WM_TEST7_STORAGE_STATE }}
          WM_TEST8_STORAGE_STATE: ${{ secrets.WM_TEST8_STORAGE_STATE }}
          WM_TEST9_STORAGE_STATE: ${{ secrets.WM_TEST9_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('state1.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state2.json').write_text(os.environ['WM_TEST2_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state3.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state4.json').write_text(os.environ['WM_TEST4_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state5.json').write_text(os.environ['WM_TEST5_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state6.json').write_text(os.environ['WM_TEST6_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state7.json').write_text(os.environ['WM_TEST7_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state8.json').write_text(os.environ['WM_TEST8_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state9.json').write_text(os.environ['WM_TEST9_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s)
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      # --count 10, ramene de 30 le 04/09/2026.
      #
      # Le raisonnement d'origine ("ne coute rien, la boucle sort des que
      # packs_remaining tombe a 0") etait faux : la regeneration suit le
      # rythme des ouvertures, packs_remaining reste a 9 pendant la rafale,
      # donc la boucle ne s'arrete jamais et va jusqu'a 30. Ce n'est pas
      # rattraper un trou de cron, c'est consommer le quota aussi vite que
      # le serveur le reconstitue.
      #
      # Or le jeu impose une LIMITE QUOTIDIENNE d'ouverture (429 avec
      # rate_limit_daily, retry_after a 12 h -- cf CLAUDE.md). Les comptes 2
      # et 3 saturaient 30/30 a chaque run et se retrouvaient bloques douze
      # heures, pendant lesquelles la regeneration bute sur le plafond de
      # stock (~10) et se perd : environ 70 paquets par compte et par jour.
      #
      # 10 = un stock par passage. Le total quotidien ne baisse pas -- il
      # est plafonne par le quota de toute facon -- on cesse simplement d'en
      # jeter la moitie.
      #
      # continue-on-error : la panne d'un compte ne doit pas priver les
      # suivants de leur ouverture.
      - name: Compte 1 -> ouvre tous ses boosters
        continue-on-error: true
        id: c0
        run: python wm_open_booster.py --api --count 10 --state state1.json

      - name: Compte 1 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST_STORAGE_STATE --repo ${{ github.repository }} < state1.json

      - name: Compte 2 -> ouvre tous ses boosters
        continue-on-error: true
        id: c1
        run: python wm_open_booster.py --api --count 10 --state state2.json

      - name: Compte 2 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST2_STORAGE_STATE --repo ${{ github.repository }} < state2.json

      - name: Collecteur -> ouvre tous ses boosters
        continue-on-error: true
        id: c2
        run: python wm_open_booster.py --api --count 10 --state state3.json

      - name: Collecteur -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST3_STORAGE_STATE --repo ${{ github.repository }} < state3.json

      - name: Compte 4 -> ouvre tous ses boosters
        continue-on-error: true
        id: c3
        run: python wm_open_booster.py --api --count 10 --state state4.json

      - name: Compte 4 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST4_STORAGE_STATE --repo ${{ github.repository }} < state4.json

      - name: Compte 5 -> ouvre tous ses boosters
        continue-on-error: true
        id: c4
        run: python wm_open_booster.py --api --count 10 --state state5.json

      - name: Compte 5 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST5_STORAGE_STATE --repo ${{ github.repository }} < state5.json

      - name: Compte 6 -> ouvre tous ses boosters
        continue-on-error: true
        id: c5
        run: python wm_open_booster.py --api --count 10 --state state6.json

      - name: Compte 6 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST6_STORAGE_STATE --repo ${{ github.repository }} < state6.json

      - name: Compte 7 -> ouvre tous ses boosters
        continue-on-error: true
        id: c6
        run: python wm_open_booster.py --api --count 10 --state state7.json

      - name: Compte 7 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST7_STORAGE_STATE --repo ${{ github.repository }} < state7.json

      - name: Compte 8 -> ouvre tous ses boosters
        continue-on-error: true
        id: c7
        run: python wm_open_booster.py --api --count 10 --state state8.json

      - name: Compte 8 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST8_STORAGE_STATE --repo ${{ github.repository }} < state8.json

      - name: Compte 9 -> ouvre tous ses boosters
        continue-on-error: true
        id: c8
        run: python wm_open_booster.py --api --count 10 --state state9.json

      - name: Compte 9 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST9_STORAGE_STATE --repo ${{ github.repository }} < state9.json

      # Rend les comptes en echec VISIBLES. Avec continue-on-error, un
      # compte dont la session est morte laisse le job en "success" : le
      # compte 2 est reste en 401 sans que personne le remarque, le
      # 04/09/2026. On resume ici qui est tombe, et on fait echouer le job
      # pour declencher la notification GitHub habituelle.
      - name: Signale les comptes en echec
        if: always()
        run: |
          echecs=""
          [ "${{ steps.c0.outcome }}" = "success" ] || echecs="$echecs compte1"
          [ "${{ steps.c1.outcome }}" = "success" ] || echecs="$echecs compte2"
          [ "${{ steps.c2.outcome }}" = "success" ] || echecs="$echecs collecteur"
          [ "${{ steps.c3.outcome }}" = "success" ] || echecs="$echecs compte4"
          [ "${{ steps.c4.outcome }}" = "success" ] || echecs="$echecs compte5"
          [ "${{ steps.c5.outcome }}" = "success" ] || echecs="$echecs compte6"
          [ "${{ steps.c6.outcome }}" = "success" ] || echecs="$echecs compte7"
          [ "${{ steps.c7.outcome }}" = "success" ] || echecs="$echecs compte8"
          [ "${{ steps.c8.outcome }}" = "success" ] || echecs="$echecs compte9"
          if [ -n "$echecs" ]; then
            {
              echo "## Comptes en echec :$echecs"
              echo ""
              echo "Session probablement revoquee. Reparation :"
              echo '```'
              echo "python wm_session_repair.py$echecs"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Tous les comptes ont ete traites" | tee -a "$GITHUB_STEP_SUMMARY"
