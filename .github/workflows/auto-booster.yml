name: Auto-ouverture booster WikiMasters (compte test)

# Ouvre les boosters via l'API directe (wm_open_booster.py --api). Aucun
# navigateur -- donc sans dependance a Chrome, compatible avec un runner
# GitHub Actions standard (ubuntu-latest). Pense pour le COMPTE DE TEST
# uniquement (cf storage_state.json regenere pour ce compte, stocke comme
# secret du repo, jamais commite).
#
# La defausse des cartes C/PC/R (wm_discard.py) est un workflow separe
# depuis le 30/08/2026 (discard.yml) -- avant, c'etait une etape couplee
# ici, decouplee pour tourner sur son propre cron independant.
#
# Cron GitHub Actions : pas garanti a la minute pres (peut etre retarde en
# periode de charge), et l'intervalle mini documente est 5 minutes. Un
# jitter aleatoire (0-15s) est ajoute avant l'appel pour eviter un motif
# parfaitement regulier -- un cron pile a l'heure est justement le signal
# le plus facile a reperer pour un anti-bot.
#
# Change le 30/08/2026 : au lieu d'ouvrir 1 booster toutes les 10 min, ce
# workflow ouvre maintenant TOUS les boosters disponibles d'un coup
# (wm_open_booster.py --api --count 10 -- s'arrete de lui-meme des que
# packs_remaining tombe a 0, cf open_via_api()), avec 5-10s entre chaque
# ouverture (API_DELAY dans wm_open_booster.py).
#
# Cadence de 50 min (etait 90 min) : les jetons Supabase du site durent
# exactement 1h (expires_in: 3600), donc un cycle plus court que l'heure
# garantit qu'au moins un run tombe dans la fenetre de validite apres
# chaque reconnexion. Attention, ca n'allonge PAS la duree de vie du
# jeton : celui stocke dans le secret reste fige et meurt 1h apres la
# connexion locale (verifie le 30/08/2026 -- ni une requete de page ni un
# appel API ne fait tourner les cookies).
#
# 50 min n'etant pas un diviseur de 60, le motif ne se referme qu'au bout
# de 5h (PPCM de 50 et 60 = 300 min), d'ou six lignes cron : c'est la
# seule facon d'exprimer un intervalle exact de 50 min en cron, "*/50"
# etant invalide sur le champ des minutes.

on:
  schedule:
    - cron: "0 0,5,10,15,20 * * *"
    - cron: "10 4,9,14,19 * * *"
    - cron: "20 3,8,13,18,23 * * *"
    - cron: "30 2,7,12,17,22 * * *"
    - cron: "40 1,6,11,16,21 * * *"
    - cron: "50 0,5,10,15,20 * * *"
  workflow_dispatch: {}  # bouton "Run workflow" manuel, utile pour tester
  workflow_call: {}  # appelable depuis open-all-boosters.yml (secrets: inherit)

permissions:
  contents: read

concurrency:
  group: wm-auto-booster
  cancel-in-progress: false

jobs:
  open-booster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit la session du compte de test depuis le secret
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('storage_state.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s) avant l'appel
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      - name: Ouvre tous les boosters disponibles (mode API, sans navigateur)
        run: python wm_open_booster.py --api --count 10
