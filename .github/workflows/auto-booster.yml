name: Auto-ouverture booster WikiMasters (compte test)

# Ouvre un booster via l'API directe (wm_open_booster.py --api), puis
# defausse les cartes Communes/Peu Communes/Rares fraichement recues
# (wm_discard.py, filtre strict --rarities C,PC,R -- jamais SR/UR/L).
# Aucun navigateur -- donc sans dependance a Chrome, compatible avec un
# runner GitHub Actions standard (ubuntu-latest). Pense pour le COMPTE DE
# TEST uniquement (cf storage_state.json regenere pour ce compte, stocke
# comme secret du repo, jamais commite).
#
# wm_discard.py utilise un parametre d'API explicite (rarity=X a chaque
# appel), pas un bouton d'interface a etat ambigu -- contrairement a la
# fonctionnalite de selection multiple de l'UI (ecartee le 30/08/2026
# apres un incident ou un filtre de rareté mal reinitialise avait fait
# defausser des cartes SR par erreur), cette approche ne peut pas deriver
# vers une autre rarete par accident.
#
# Cron GitHub Actions : pas garanti a la minute pres (peut etre retarde en
# periode de charge), et l'intervalle mini documente est 5 minutes. 10 min
# ici, aligne sur le rythme de wm_auto_booster.py en local. Un jitter
# aleatoire (0-15s) est ajoute avant l'appel pour eviter un motif
# parfaitement regulier -- un cron pile a l'heure est justement le signal
# le plus facile a reperer pour un anti-bot.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # bouton "Run workflow" manuel, utile pour tester

permissions:
  contents: read

concurrency:
  group: wm-auto-booster
  cancel-in-progress: false

jobs:
  open-booster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit la session du compte de test depuis le secret
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('storage_state.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s) avant l'appel
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      - name: Ouvre un booster (mode API, sans navigateur)
        run: python wm_open_booster.py --api

      - name: Defausse les cartes C/PC/R (plafond de securite par run)
        run: python wm_discard.py --rarities C,PC,R --max 50
