name: Auto-ouverture booster WikiMasters (collecteur)

# Meme logique que auto-booster.yml (voir ce fichier pour les details
# complets), pour le 3e compte (le compte collecteur, qui
# recoit aussi les WB des deux autres via trade.yml). Fichier separe comme
# les deux premiers comptes.
#
# Cadence 50 min (voir auto-booster.yml pour le pourquoi des six lignes
# cron et le lien avec l'expiration des jetons Supabase), decale de
# +20 min par rapport au compte 1 : les cinq comptes se repartissent sur
# le cycle par pas de 10 min (0/10/20/30/40) pour qu'ils ne tapent jamais
# l'API au meme instant.

on:
  schedule:
    - cron: "0 2,7,12,17,22 * * *"
    - cron: "10 1,6,11,16,21 * * *"
    - cron: "20 0,5,10,15,20 * * *"
    - cron: "30 4,9,14,19 * * *"
    - cron: "40 3,8,13,18,23 * * *"
    - cron: "50 2,7,12,17,22 * * *"
  workflow_dispatch: {}
  workflow_call: {}  # appelable depuis open-all-boosters.yml (secrets: inherit)

permissions:
  contents: read

concurrency:
  group: wm-auto-booster-3
  cancel-in-progress: false

jobs:
  open-booster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit la session du collecteur depuis le secret
        env:
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('storage_state.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s) avant l'appel
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      # --count 30 (etait 10) : le 31/08/2026, apres un trou de 127 min
      # dans les crons, compte 1 avait 13 paquets en attente -- la boucle
      # s'est arretee a 10 par NOTRE limite et en a laisse 3 sur la table.
      # La charge du jeu ne plafonne donc pas a 10 comme suppose. Monter la
      # limite ne coute rien : open_via_api() sort des que packs_remaining
      # tombe a 0, donc un run sans paquet reste aussi court qu'avant. 30
      # couvre ~5h d'accumulation (regeneration mesuree : ~9,6 min/paquet).
      - name: Ouvre tous les boosters disponibles (mode API, sans navigateur)
        run: python wm_open_booster.py --api --count 30

      # Renvoie la session dans le secret. Indispensable : le serveur fait
      # tourner le refresh token des que le jeton d'acces a expire, et
      # rejouer un jeton perime fait REVOQUER la session par Supabase.
      # Sans cette etape, chaque run tuait la session du run suivant
      # (cf wm_session_io.py). `if: always()` car la rotation a pu avoir
      # lieu avant l'erreur qui a fait echouer l'etape precedente.
      - name: Sauvegarde la session (rotation du jeton) dans le secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST3_STORAGE_STATE --repo ${{ github.repository }} < storage_state.json
