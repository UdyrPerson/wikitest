name: Rapport cartes UR/L (5 comptes)

# Workflow purement informationnel : ne fait que des GET, n'ouvre rien, ne
# defausse rien, n'echange rien. Agrege les cartes UR et L des cinq comptes
# et affiche le solde de wikibidous du compte collecteur (cf trade.yml).
#
# Le rapport est ecrit dans le resume du run ($GITHUB_STEP_SUMMARY) : il
# s'affiche directement sur la page de l'execution, sans avoir a ouvrir les
# logs -- lisible depuis un telephone.
#
# Declenchement manuel uniquement : c'est une consultation, pas une tache
# de fond. Un cron ferait tourner un rapport que personne ne lit.
#
# Traitement compte par compte, avec sauvegarde du secret juste apres
# chacun (et non les cinq a la fin) : meme correction que discard.yml et
# trade.yml le 30/08/2026. Un seul appel pour les cinq comptes chargeait
# les cinq secrets au demarrage puis les reecrivait tous a la fin, ce qui
# ecrasait ceux qu'un workflow de booster avait rafraichis entre-temps --
# la version ecrasee portant un refresh token deja consomme, le compte
# tombait en 401 au run suivant. Chaque compte ecrit ici un fragment JSON ;
# une derniere etape les fusionne pour retrouver le tableau agrege.
#
# "Lecture seule" ne veut pas dire "sans effet sur la session" : un simple
# GET suffit a declencher la rotation du jeton cote serveur, donc ce
# rapport doit sauvegarder et repousser comme les autres.

on:
  workflow_dispatch:
    inputs:
      rarities:
        description: "Raretes a lister (separees par des virgules)"
        required: false
        default: "UR,L"

permissions:
  contents: read

concurrency:
  group: wm-report-rares
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit les sessions des cinq comptes depuis les secrets
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
          WM_TEST2_STORAGE_STATE: ${{ secrets.WM_TEST2_STORAGE_STATE }}
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
          WM_TEST4_STORAGE_STATE: ${{ secrets.WM_TEST4_STORAGE_STATE }}
          WM_TEST5_STORAGE_STATE: ${{ secrets.WM_TEST5_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('state1.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state2.json').write_text(os.environ['WM_TEST2_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state3.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state4.json').write_text(os.environ['WM_TEST4_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state5.json').write_text(os.environ['WM_TEST5_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s)
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      - name: Compte 1 -> lecture
        continue-on-error: true
        run: python wm_report_rares.py compte1=state1.json --rarities "${{ inputs.rarities }}" --json-out frag1.json

      - name: Compte 1 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST_STORAGE_STATE --repo ${{ github.repository }} < state1.json

      - name: Compte 2 -> lecture
        continue-on-error: true
        run: python wm_report_rares.py compte2=state2.json --rarities "${{ inputs.rarities }}" --json-out frag2.json

      - name: Compte 2 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST2_STORAGE_STATE --repo ${{ github.repository }} < state2.json

      - name: Collecteur -> lecture (+ solde)
        continue-on-error: true
        run: python wm_report_rares.py collecteur=state3.json --rarities "${{ inputs.rarities }}" --balance-of collecteur --json-out frag3.json

      - name: Collecteur -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST3_STORAGE_STATE --repo ${{ github.repository }} < state3.json

      - name: Compte 4 -> lecture
        continue-on-error: true
        run: python wm_report_rares.py compte4=state4.json --rarities "${{ inputs.rarities }}" --json-out frag4.json

      - name: Compte 4 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST4_STORAGE_STATE --repo ${{ github.repository }} < state4.json

      - name: Compte 5 -> lecture
        continue-on-error: true
        run: python wm_report_rares.py compte5=state5.json --rarities "${{ inputs.rarities }}" --json-out frag5.json

      - name: Compte 5 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST5_STORAGE_STATE --repo ${{ github.repository }} < state5.json

      # Fusionne les fragments produits ci-dessus. `if: always()` et le glob
      # tolerant : un compte dont la lecture a echoue n'a pas de fragment,
      # le rapport se fait avec les autres.
      - name: Agrege les fragments dans le resume du run
        if: always()
        run: |
          python wm_report_rares.py --merge $(ls frag*.json 2>/dev/null) \
            | tee -a "$GITHUB_STEP_SUMMARY"
