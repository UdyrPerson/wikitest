name: Trade WB vers collecteur

# Consolide les wikibidous des quatre comptes emetteurs vers collecteur,
# via le systeme d'echange du jeu : wm_trade_gift_wb.py (offre tout le
# solde, sans carte) sur chaque emetteur, puis wm_trade_accept_all.py
# (accepte toutes les offres en attente) sur collecteur. Pure API, pas de
# navigateur -- meme principe que auto-booster.yml / auto-booster-2.yml.
#
# collecteur doit deja etre "ami" avec chaque compte emetteur :
# wm_trade_gift_wb.py resout le pseudo via /api/friends et echoue
# clairement si l'amitie n'existe pas encore. Amities verifiees
# "accepted" pour les quatre emetteurs le 30/08/2026.
#
# Cadence 50 min (etait horaire), alignee sur les autres workflows : un
# cycle plus court que l'heure evite de tomber systematiquement apres
# l'expiration des jetons Supabase, qui durent exactement 1h. Voir
# auto-booster.yml pour le pourquoi des six lignes cron. Decale de
# +25 min par rapport au compte 1 pour ne croiser ni les creneaux
# d'ouverture (0/10/20/30/40) ni celui de la defausse (+5).

on:
  schedule:
    - cron: "5 2,7,12,17,22 * * *"
    - cron: "15 1,6,11,16,21 * * *"
    - cron: "25 0,5,10,15,20 * * *"
    - cron: "35 4,9,14,19 * * *"
    - cron: "45 3,8,13,18,23 * * *"
    - cron: "55 2,7,12,17,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: wm-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit les 5 sessions depuis les secrets
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
          WM_TEST2_STORAGE_STATE: ${{ secrets.WM_TEST2_STORAGE_STATE }}
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
          WM_TEST4_STORAGE_STATE: ${{ secrets.WM_TEST4_STORAGE_STATE }}
          WM_TEST5_STORAGE_STATE: ${{ secrets.WM_TEST5_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('state1.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state2.json').write_text(os.environ['WM_TEST2_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state3.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state4.json').write_text(os.environ['WM_TEST4_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state5.json').write_text(os.environ['WM_TEST5_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s)
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      # continue-on-error sur chaque emetteur : la session Supabase expire
      # au bout d'une heure pile (expires_in: 3600), donc un emetteur peut
      # avoir une session morte au moment du run. Sans ca, son 401 arretait
      # le job et empechait les autres d'envoyer -- et surtout empechait
      # l'etape d'acceptation ci-dessous de s'executer.
      - name: Compte 1 -> offre tout son solde a collecteur
        continue-on-error: true
        run: python wm_trade_gift_wb.py state1.json collecteur

      - name: Compte 2 -> offre tout son solde a collecteur
        continue-on-error: true
        run: python wm_trade_gift_wb.py state2.json collecteur

      - name: compte 4 -> offre tout son solde a collecteur
        continue-on-error: true
        run: python wm_trade_gift_wb.py state4.json collecteur

      - name: compte 5 -> offre tout son solde a collecteur
        continue-on-error: true
        run: python wm_trade_gift_wb.py state5.json collecteur

      - name: collecteur -> accepte toutes les offres en attente
        run: python wm_trade_accept_all.py state3.json
