name: Trade WB vers le compte collecteur

# Consolide les wikibidous des quatre comptes emetteurs vers le compte
# collecteur (compte 3), via le systeme d'echange du jeu :
# wm_trade_gift_wb.py (offre tout le solde, sans carte) sur chaque
# emetteur, puis wm_trade_accept_all.py (accepte toutes les offres en
# attente) sur le collecteur. Pure API, pas de navigateur -- meme principe
# que auto-booster.yml / auto-booster-2.yml.
#
# Le pseudo du collecteur vit dans le secret WM_TRADE_RECIPIENT plutot
# qu'en dur ici : c'est le seul pseudo dont le script a fonctionnellement
# besoin (wm_trade_gift_wb.py le resout via /api/friends), et le garder
# hors du code evite de publier le lien entre les comptes.
#
# Le collecteur doit deja etre "ami" avec chaque compte emetteur : le
# script echoue clairement si l'amitie n'existe pas encore.
#
# Cadence 50 min (etait horaire), alignee sur les autres workflows : un
# cycle plus court que l'heure evite de tomber systematiquement apres
# l'expiration des jetons Supabase, qui durent exactement 1h. Voir
# auto-booster.yml pour le pourquoi des six lignes cron. Decale de
# +25 min par rapport au compte 1 pour ne croiser ni les creneaux
# d'ouverture (0/10/20/30/40) ni celui de la defausse (+5).

on:
  schedule:
    - cron: "5 2,7,12,17,22 * * *"
    - cron: "15 1,6,11,16,21 * * *"
    - cron: "25 0,5,10,15,20 * * *"
    - cron: "35 4,9,14,19 * * *"
    - cron: "45 3,8,13,18,23 * * *"
    - cron: "55 2,7,12,17,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# CONCURRENCE PARTAGEE ENTRE TOUS LES WORKFLOWS DE SESSION.
# Les cinq workflows chargent les memes cinq secrets au demarrage et les
# repoussent apres chaque compte. Avec un groupe par workflow, rien ne les
# empechait de tourner en meme temps : chacun repoussait alors des jetons
# issus d'une copie chargee avant l'autre, ce qui rejoue un refresh token
# deja consomme et fait revoquer la session.
# Constate le 04/09/2026 : un run de boosters de 93 min pendant lequel la
# defausse, le trade et la vente sont tous passes.
concurrency:
  group: wm-sessions
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit les 5 sessions depuis les secrets
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
          WM_TEST2_STORAGE_STATE: ${{ secrets.WM_TEST2_STORAGE_STATE }}
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
          WM_TEST4_STORAGE_STATE: ${{ secrets.WM_TEST4_STORAGE_STATE }}
          WM_TEST5_STORAGE_STATE: ${{ secrets.WM_TEST5_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('state1.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state2.json').write_text(os.environ['WM_TEST2_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state3.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state4.json').write_text(os.environ['WM_TEST4_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state5.json').write_text(os.environ['WM_TEST5_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s)
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      # continue-on-error sur chaque emetteur : la session Supabase expire
      # au bout d'une heure pile (expires_in: 3600), donc un emetteur peut
      # avoir une session morte au moment du run. Sans ca, son 401 arretait
      # le job et empechait les autres d'envoyer -- et surtout empechait
      # l'etape d'acceptation ci-dessous de s'executer.
      - name: Compte 1 -> offre tout son solde au collecteur
        continue-on-error: true
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state1.json "$WM_TRADE_RECIPIENT"

      # Chaque compte renvoie SA session dans SON secret juste apres
      # avoir ete traite, et non tous les cinq a la fin. Sans ca, ce
      # workflow rechargeait les secrets au demarrage, tournait plusieurs
      # minutes, puis reecrivait les cinq -- ecrasant au passage tout
      # secret qu'un workflow de booster avait rafraichi entre-temps. La
      # version ecrasee contenait un refresh token deja consomme, donc le
      # compte tombait en 401 au run suivant (constate le 30/08/2026 sur
      # les comptes 4 et 5, traites en dernier ici, donc les plus exposes).
      # Pousser au fil de l'eau ramene la fenetre de course de plusieurs
      # minutes a quelques secondes.
      - name: Compte 1 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST_STORAGE_STATE --repo ${{ github.repository }} < state1.json

      - name: Compte 2 -> offre tout son solde au collecteur
        continue-on-error: true
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state2.json "$WM_TRADE_RECIPIENT"

      - name: Compte 2 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST2_STORAGE_STATE --repo ${{ github.repository }} < state2.json

      - name: Compte 4 -> offre tout son solde au collecteur
        continue-on-error: true
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state4.json "$WM_TRADE_RECIPIENT"

      - name: Compte 4 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST4_STORAGE_STATE --repo ${{ github.repository }} < state4.json

      - name: Compte 5 -> offre tout son solde au collecteur
        continue-on-error: true
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state5.json "$WM_TRADE_RECIPIENT"

      - name: Compte 5 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST5_STORAGE_STATE --repo ${{ github.repository }} < state5.json

      - name: Collecteur -> accepte toutes les offres en attente
        run: python wm_trade_accept_all.py state3.json

      - name: Compte 3 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST3_STORAGE_STATE --repo ${{ github.repository }} < state3.json
