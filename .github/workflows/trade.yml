name: Trade WB vers le compte collecteur

# Consolide les wikibidous des huit comptes emetteurs vers le compte
# collecteur (compte 3), via le systeme d'echange du jeu :
# wm_trade_gift_wb.py (offre tout le solde, sans carte) sur chaque
# emetteur, puis wm_trade_accept_all.py (accepte toutes les offres en
# attente) sur le collecteur. Pure API, pas de navigateur -- meme principe
# que auto-booster.yml / auto-booster-2.yml.
#
# Le pseudo du collecteur vit dans le secret WM_TRADE_RECIPIENT plutot
# qu'en dur ici : c'est le seul pseudo dont le script a fonctionnellement
# besoin (wm_trade_gift_wb.py le resout via /api/friends), et le garder
# hors du code evite de publier le lien entre les comptes.
#
# Le collecteur doit deja etre "ami" avec chaque compte emetteur : le
# script echoue clairement si l'amitie n'existe pas encore.
#
# CADENCE : UNE FOIS PAR JOUR depuis le 04/09/2026, contre 50 min avant.
#
# Un compte est limite a 50 echanges par jour. La contrainte ne porte pas
# sur les emetteurs, qui n'en envoyaient qu'un par passage, mais sur le
# COLLECTEUR : il est de tous les echanges. A 50 min de cadence, huit
# emetteurs lui adressaient environ 8 x 29 = 230 offres par jour, plus de
# quatre fois son quota. Le surplus s'accumulait en file d'attente --
# 100+ offres en attente constatees le 04/09/2026.
#
# Une seule passe par jour ramene le collecteur a 8 acceptations, tres en
# dessous du plafond. Rien n'est perdu au passage : wm_trade_gift_wb.py
# offre TOUT le solde du moment, donc un emetteur qui ne donne qu'une fois
# par jour donne la meme somme en une fois au lieu de vingt-neuf.
#
# Les autres workflows gardent leur cadence de 50 min : eux ne sont pas
# concernes par cette limite.
#
# Minute 58 : aucun autre workflow ne l'utilise (ouverture 0/10/20/30/40,
# defausse +5, vente :50). Heure 0 UTC : si le quota se remet a zero a
# minuit UTC, la passe part sur un compteur neuf ; s'il s'agit d'une
# fenetre glissante, l'heure n'a aucune importance -- dans les deux cas ce
# creneau n'est jamais le mauvais.

on:
  schedule:
    - cron: "58 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# CONCURRENCE PARTAGEE ENTRE TOUS LES WORKFLOWS DE SESSION.
# Les cinq workflows chargent les memes cinq secrets au demarrage et les
# repoussent apres chaque compte. Avec un groupe par workflow, rien ne les
# empechait de tourner en meme temps : chacun repoussait alors des jetons
# issus d'une copie chargee avant l'autre, ce qui rejoue un refresh token
# deja consomme et fait revoquer la session.
# Constate le 04/09/2026 : un run de boosters de 93 min pendant lequel la
# defausse, le trade et la vente sont tous passes.
concurrency:
  group: wm-sessions
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Ecrit les neuf sessions depuis les secrets
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
          WM_TEST2_STORAGE_STATE: ${{ secrets.WM_TEST2_STORAGE_STATE }}
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
          WM_TEST4_STORAGE_STATE: ${{ secrets.WM_TEST4_STORAGE_STATE }}
          WM_TEST5_STORAGE_STATE: ${{ secrets.WM_TEST5_STORAGE_STATE }}
          WM_TEST6_STORAGE_STATE: ${{ secrets.WM_TEST6_STORAGE_STATE }}
          WM_TEST7_STORAGE_STATE: ${{ secrets.WM_TEST7_STORAGE_STATE }}
          WM_TEST8_STORAGE_STATE: ${{ secrets.WM_TEST8_STORAGE_STATE }}
          WM_TEST9_STORAGE_STATE: ${{ secrets.WM_TEST9_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('state1.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state2.json').write_text(os.environ['WM_TEST2_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state3.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state4.json').write_text(os.environ['WM_TEST4_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state5.json').write_text(os.environ['WM_TEST5_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state6.json').write_text(os.environ['WM_TEST6_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state7.json').write_text(os.environ['WM_TEST7_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state8.json').write_text(os.environ['WM_TEST8_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state9.json').write_text(os.environ['WM_TEST9_STORAGE_STATE'])"

      - name: Jitter aleatoire (0-15s)
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      # continue-on-error sur chaque emetteur : la session Supabase expire
      # au bout d'une heure pile (expires_in: 3600), donc un emetteur peut
      # avoir une session morte au moment du run. Sans ca, son 401 arretait
      # le job et empechait les autres d'envoyer -- et surtout empechait
      # l'etape d'acceptation ci-dessous de s'executer.
      - name: Compte 1 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c0
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state1.json "$WM_TRADE_RECIPIENT"

      # Chaque compte renvoie SA session dans SON secret juste apres
      # avoir ete traite, et non tous les cinq a la fin. Sans ca, ce
      # workflow rechargeait les secrets au demarrage, tournait plusieurs
      # minutes, puis reecrivait les cinq -- ecrasant au passage tout
      # secret qu'un workflow de booster avait rafraichi entre-temps. La
      # version ecrasee contenait un refresh token deja consomme, donc le
      # compte tombait en 401 au run suivant (constate le 30/08/2026 sur
      # les comptes 4 et 5, traites en dernier ici, donc les plus exposes).
      # Pousser au fil de l'eau ramene la fenetre de course de plusieurs
      # minutes a quelques secondes.
      - name: Compte 1 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST_STORAGE_STATE --repo ${{ github.repository }} < state1.json

      - name: Compte 2 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c1
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state2.json "$WM_TRADE_RECIPIENT"

      - name: Compte 2 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST2_STORAGE_STATE --repo ${{ github.repository }} < state2.json

      - name: Compte 4 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c2
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state4.json "$WM_TRADE_RECIPIENT"

      - name: Compte 4 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST4_STORAGE_STATE --repo ${{ github.repository }} < state4.json

      - name: Compte 5 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c3
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state5.json "$WM_TRADE_RECIPIENT"

      - name: Compte 5 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST5_STORAGE_STATE --repo ${{ github.repository }} < state5.json

      - name: Compte 6 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c4
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state6.json "$WM_TRADE_RECIPIENT"

      - name: Compte 6 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST6_STORAGE_STATE --repo ${{ github.repository }} < state6.json

      - name: Compte 7 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c5
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state7.json "$WM_TRADE_RECIPIENT"

      - name: Compte 7 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST7_STORAGE_STATE --repo ${{ github.repository }} < state7.json

      - name: Compte 8 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c6
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state8.json "$WM_TRADE_RECIPIENT"

      - name: Compte 8 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST8_STORAGE_STATE --repo ${{ github.repository }} < state8.json

      - name: Compte 9 -> offre tout son solde au collecteur
        continue-on-error: true
        id: c7
        env:
          WM_TRADE_RECIPIENT: ${{ secrets.WM_TRADE_RECIPIENT }}
        run: python wm_trade_gift_wb.py state9.json "$WM_TRADE_RECIPIENT"

      - name: Compte 9 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST9_STORAGE_STATE --repo ${{ github.repository }} < state9.json

      # Le collecteur est le seul compte dont l'echec ne se rattrape pas :
      # les huit offres du jour restent en attente. Il lui manquait
      # pourtant l'id et le continue-on-error des autres, donc il
      # n'apparaissait pas dans le bilan -- le 05/09/2026, sa session est
      # morte a 11:29 et chaque run a affiche « Tous les comptes ont ete
      # traites » pendant six heures, pendant que les offres s'empilaient.
      - name: Collecteur -> accepte toutes les offres en attente
        id: c8
        continue-on-error: true
        run: python wm_trade_accept_all.py state3.json

      - name: Compte 3 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST3_STORAGE_STATE --repo ${{ github.repository }} < state3.json

      # Rend les comptes en echec VISIBLES. Avec continue-on-error, un
      # compte dont la session est morte laisse le job en "success" : le
      # compte 2 est reste en 401 sans que personne le remarque, le
      # 04/09/2026. On resume ici qui est tombe, et on fait echouer le job
      # pour declencher la notification GitHub habituelle.
      - name: Signale les comptes en echec
        if: always()
        run: |
          echecs=""
          [ "${{ steps.c0.outcome }}" = "success" ] || echecs="$echecs compte1"
          [ "${{ steps.c1.outcome }}" = "success" ] || echecs="$echecs compte2"
          [ "${{ steps.c2.outcome }}" = "success" ] || echecs="$echecs compte4"
          [ "${{ steps.c3.outcome }}" = "success" ] || echecs="$echecs compte5"
          [ "${{ steps.c4.outcome }}" = "success" ] || echecs="$echecs compte6"
          [ "${{ steps.c5.outcome }}" = "success" ] || echecs="$echecs compte7"
          [ "${{ steps.c6.outcome }}" = "success" ] || echecs="$echecs compte8"
          [ "${{ steps.c7.outcome }}" = "success" ] || echecs="$echecs compte9"
          [ "${{ steps.c8.outcome }}" = "success" ] || echecs="$echecs collecteur"
          if [ -n "$echecs" ]; then
            {
              echo "## Comptes en echec :$echecs"
              echo ""
              echo "Session probablement revoquee. Reparation :"
              echo '```'
              echo "python wm_session_repair.py$echecs"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## Tous les comptes ont ete traites" | tee -a "$GITHUB_STEP_SUMMARY"
