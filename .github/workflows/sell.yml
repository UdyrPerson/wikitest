name: Mise en vente L (5 comptes)

# Met aux encheres les meilleures cartes L de chaque compte, selon la table
# de reference des prix reels (reference/L.json) et la strategie decrite
# dans wm_sell_auto.py : prix = moyenne x 1.10, duree 6 h, priorisation par
# esperance de gain.
#
# Extension aux UR : rien a changer ici une fois reference/UR.json construit
# (wm_reference_build.py --rarity UR), il suffira de passer --rarities L,UR.
# C'est pour ca que le parametre existe des maintenant.
#
# LA TABLE DE REFERENCE DOIT ETRE COMMITEE. data/ est dans le .gitignore et
# un runner part d'un checkout propre : sans reference/L.json versionne, le
# script ne trouve aucun prix et ne vend rien. C'est le role de
# wm_reference_build.py, qui condense les 5,6 Mo du scrape en 479 Ko.
#
# Pure API, pas de navigateur, comme les autres workflows du projet.
#
# UN SEUL JOB pour les cinq comptes : GitHub facture a la minute entamee ET
# par job (cf boosters.yml, et l'epuisement de quota du 03/09/2026).
#
# Chaque compte repousse SA session dans SON secret juste apres son
# passage, jamais tous a la fin : sinon on ecrase un secret rafraichi
# entre-temps par un autre workflow, avec un refresh token deja consomme a
# la cle -- ce qui revoque la session (cf wm_session_io.py).
#
# CADENCE. Une annonce dure 6 h, donc un emplacement ne se libere qu'a ce
# rythme : tourner toutes les 50 min comme les boosters ne servirait a
# rien, la plupart des runs ne trouveraient aucun emplacement libre. A 3 h,
# un emplacement libere est repris en moins de 3 h. Ce n'est pas une
# economie de minutes (le depot est public, elles sont gratuites) mais un
# alignement sur la duree de vie des annonces.

on:
  schedule:
    - cron: "20 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation seulement (aucune mise en vente)"
        type: boolean
        required: false
        default: true
      rarities:
        description: "Raretes a vendre (L, ou L,UR quand UR sera scrape)"
        required: false
        default: "L,UR"
      duration:
        description: "Duree des encheres"
        type: choice
        required: false
        default: "360"
        # Les sept paliers de l'interface du jeu, et rien d'autre. Le
        # serveur accepte n'importe quelle valeur entre 10 min et 24 h,
        # mais une duree que le jeu ne propose pas signale une annonce
        # automatisee.
        options:
          - "10"
          - "30"
          - "60"
          - "180"
          - "360"
          - "720"
          - "1440"

permissions:
  contents: read

concurrency:
  group: wm-sell
  cancel-in-progress: false

env:
  RARITIES: ${{ inputs.rarities || 'L,UR' }}
  DUREE: ${{ inputs.duration || '360' }}

jobs:
  sell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installe Playwright (client API seulement, pas de navigateur)
        run: pip install playwright

      - name: Verifie que la table de reference est bien presente
        run: |
          test -f reference/L.json || {
            echo "reference/L.json manquant : lance wm_reference_build.py et commite-le."
            exit 1
          }

      - name: Ecrit les sessions des cinq comptes depuis les secrets
        env:
          WM_TEST_STORAGE_STATE: ${{ secrets.WM_TEST_STORAGE_STATE }}
          WM_TEST2_STORAGE_STATE: ${{ secrets.WM_TEST2_STORAGE_STATE }}
          WM_TEST3_STORAGE_STATE: ${{ secrets.WM_TEST3_STORAGE_STATE }}
          WM_TEST4_STORAGE_STATE: ${{ secrets.WM_TEST4_STORAGE_STATE }}
          WM_TEST5_STORAGE_STATE: ${{ secrets.WM_TEST5_STORAGE_STATE }}
        run: |
          python -c "import os, pathlib; pathlib.Path('state1.json').write_text(os.environ['WM_TEST_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state2.json').write_text(os.environ['WM_TEST2_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state3.json').write_text(os.environ['WM_TEST3_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state4.json').write_text(os.environ['WM_TEST4_STORAGE_STATE'])"
          python -c "import os, pathlib; pathlib.Path('state5.json').write_text(os.environ['WM_TEST5_STORAGE_STATE'])"

      # Simulation uniquement si le run est manuel ET la case cochee ; un
      # run planifie vend toujours.
      #
      # Ecrit en if/else et non avec le ternaire "a && b || c" des
      # expressions GitHub : quand la valeur du cas vrai est la chaine vide
      # (ce qu'on veut ici, "pas de --go"), elle est falsy et l'expression
      # bascule sur le cas faux. Cocher dry_run aurait donc quand meme
      # vendu, sur les cinq comptes.
      - name: Determine le mode (vente ou simulation)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "GO=" >> "$GITHUB_ENV"
            echo "Mode SIMULATION : aucune mise en vente."
          else
            echo "GO=--go" >> "$GITHUB_ENV"
            echo "Mode VENTE."
          fi

      - name: Jitter aleatoire (0-15s)
        run: python -c "import random, time; time.sleep(random.uniform(0, 15))"

      # continue-on-error sur chaque compte : une session expiree ne doit
      # pas priver les comptes suivants de leur mise en vente.
      - name: Compte 1 -> mise en vente
        continue-on-error: true
        run: python wm_sell_auto.py state1.json --rarities "$RARITIES" --duration "$DUREE" --json-out frag1.json --label compte1 $GO

      - name: Compte 1 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST_STORAGE_STATE --repo ${{ github.repository }} < state1.json

      - name: Compte 2 -> mise en vente
        continue-on-error: true
        run: python wm_sell_auto.py state2.json --rarities "$RARITIES" --duration "$DUREE" --json-out frag2.json --label compte2 $GO

      - name: Compte 2 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST2_STORAGE_STATE --repo ${{ github.repository }} < state2.json

      - name: Collecteur -> mise en vente
        continue-on-error: true
        run: python wm_sell_auto.py state3.json --rarities "$RARITIES" --duration "$DUREE" --json-out frag3.json --label collecteur $GO

      - name: Collecteur -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST3_STORAGE_STATE --repo ${{ github.repository }} < state3.json

      - name: Compte 4 -> mise en vente
        continue-on-error: true
        run: python wm_sell_auto.py state4.json --rarities "$RARITIES" --duration "$DUREE" --json-out frag4.json --label compte4 $GO

      - name: Compte 4 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST4_STORAGE_STATE --repo ${{ github.repository }} < state4.json

      - name: Compte 5 -> mise en vente
        continue-on-error: true
        run: python wm_sell_auto.py state5.json --rarities "$RARITIES" --duration "$DUREE" --json-out frag5.json --label compte5 $GO

      - name: Compte 5 -> sauvegarde la session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
        run: gh secret set WM_TEST5_STORAGE_STATE --repo ${{ github.repository }} < state5.json

      # Recapitulatif final, sur le modele de report-rares.yml : chaque
      # compte a depose son fragment juste apres son passage, on les
      # fusionne ici en Markdown dans le resume du run. Lisible sans
      # ouvrir les logs, donc consultable depuis un telephone.
      #
      # if: always() et glob tolerant : un compte dont la mise en vente a
      # echoue n'a pas de fragment, le recapitulatif se fait avec les
      # autres.
      - name: Recapitulatif des mises en vente
        if: always()
        run: |
          python wm_sell_auto.py --merge $(ls frag*.json 2>/dev/null)             | tee -a "$GITHUB_STEP_SUMMARY"
